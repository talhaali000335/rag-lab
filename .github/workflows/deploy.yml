name: deploy
on:
  push:
    branches: [main]
permissions:
  id-token: write
  contents: read
env:
  AWS_REGION: us-east-1
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/rag-lab
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy via SSM
        run: |
          REG=${{ steps.ecr.outputs.registry }}
          B64=$(base64 -w0 deploy/docker-compose.prod.yml)
          C="docker compose -f docker-compose.prod.yml --env-file .env.prod"
          cat > params.json <<EOF
          {"commands":[
          "set -e",
          "export HOME=/root",
          "cd /opt/raglab",
          "echo $B64 | base64 -d > docker-compose.prod.yml",
          "aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REG",
          "export IMAGE=$REG/rag-lab:${{ github.sha }}",
          "$C pull",
          "$C up -d db",
          "$C run --rm web python manage.py migrate --noinput",
          "$C up -d",
          "docker image prune -f"
          ]}
          EOF
          CMD_ID=$(aws ssm send-command \
            --instance-ids ${{ secrets.INSTANCE_ID }} \
            --document-name AWS-RunShellScript \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id $CMD_ID --instance-id ${{ secrets.INSTANCE_ID }} || true
          aws ssm get-command-invocation --command-id $CMD_ID --instance-id ${{ secrets.INSTANCE_ID }} \
            --query '[Status,StandardOutputContent,StandardErrorContent]' --output text