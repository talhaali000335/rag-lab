name: ci-cd
on:
  push: {branches: [main]}
  pull_request:

permissions:
  id-token: write   # lets GitHub request short-lived AWS credentials (OIDC)
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    env: {DJANGO_DEBUG: "1", GIT_SHA: "${{ github.sha }}"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py test
      - run: python manage.py run_eval --min-hit-rate 0.8

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC claims (temporary)
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          python3 -c "import sys,json,base64; p=sys.argv[1].split('.')[1]; p+='='*(-len(p)%4); d=json.loads(base64.urlsafe_b64decode(p)); print({k:d.get(k) for k in ('sub','aud','repository','ref','job_workflow_ref')})" "$TOKEN"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::515579969505:role/raglab-gha-role
          aws-region: us-east-1

      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image (linux/amd64, tagged with the commit)
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/rag-lab:${{ github.sha }}
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy to EC2 through SSM (no SSH, no open port 22)
        env:
          INSTANCE: ${{ vars.EC2_INSTANCE_ID }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          SCRIPT_B64=$(base64 -w0 deploy/remote-deploy.sh)
          COMPOSE_B64=$(base64 -w0 docker-compose.prod.yml)
          CADDY_B64=$(base64 -w0 Caddyfile)
          CMD="export IMAGE='$IMAGE' REGISTRY='$REGISTRY' AWS_REGION='$AWS_REGION' COMPOSE_B64='$COMPOSE_B64' CADDY_B64='$CADDY_B64'; echo '$SCRIPT_B64' | base64 -d | bash"
          jq -n --arg id "$INSTANCE" --arg cmd "$CMD" --arg sha "${{ github.sha }}" \
            '{InstanceIds: [$id], DocumentName: "AWS-RunShellScript", Comment: ("deploy " + $sha), Parameters: {commands: [$cmd]}}' > ssm.json
          CMD_ID=$(aws ssm send-command --cli-input-json file://ssm.json --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"

          STATUS=Pending
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
            sleep 5
          done

          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" --query StandardOutputContent --output text || true
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" --query StandardErrorContent --output text || true
          echo "Final status: $STATUS"
          test "$STATUS" = "Success"