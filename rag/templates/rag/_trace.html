<ol class="trace">{% for s in steps %}<li class="step"><span class="num">{{ forloop.counter }}</span><div class="sb"><b>{{ s.title }}</b>
{% for i in s.items %}<div class="it"><span style="flex:1">{{ i.text }}</span>{% if i.badge %}<span class="bd {{ i.tone }}">{{ i.badge }}</span>{% endif %}</div>{% endfor %}
{% if s.note %}<div class="mut" style="font-size:13px;margin-top:6px">{{ s.note }}</div>{% endif %}</div></li>{% endfor %}</ol>
